<style>
  .interactive > .FORM,
  .interactive > .LEMMA,
  .interactive > .UPOS,
  .interactive > .DEPREL {
    cursor: pointer;
  }
  
  .FORM {
    font-size: 16px;
    z-index: 99;
  }
  
  .LEMMA {
    font-size: 13px;
    font-style: italic;
  }
  
  .UPOS, .XPOS {
    font: 11px DejaVu Sans;
  }
  
  .XPOS {
      font-style: italic;
  }
  
  
  .DEPREL, .DEPRELenhanced {
    font: 12px Arial;
    font-family: sans-serif;
    z-index: 99;
  }
  
  .FEATS, .MISC {
    font-size: 10px;
  }
  
  .glossy {
    font-style: italic;
  }

  .arrowhead, .curve, .arrowheadenhanced, .curveenhanced, .dragcurve {
      pointer-events: none;
      fill: none;
    }

  .curve, .curveenhanced {
    stroke-width: 1.1;
    z-index: 0;
  }
  
  .dragcurve {
    stroke-width: 2;
  }

  .arrowhead, .arrowheadenhanced {
    stroke-width: 0.8;
  }

    
    .FORM, .LEMMA {
      fill: black;
    }

    .UPOS, .DEPREL, .DEPRELenhanced {
      fill: #4a0984;;
    }

    .FEATS, .MISC, .XPOS {
      fill: #b352ac;
    }

    .UPOS.diff,
    .DEPREL.diff {
      fill: red;
    }

    .arrowhead, .arrowheadenhanced {
      fill: white;
    }

    .arrowhead, .curve {
      stroke: black;
    }

    .arrowheadenhanced, .curveenhanced {
      stroke: blue;
    }

    .arrowhead.diff, .curve.diff {
      stroke: red;
    }

    .dragcurve, .dragarrowhead {
      stroke: #ffb424;
    }

    .glossy {
      fill: #ffb424;
    }
  svg {background-color: white}</style> 
