    - tag2
    - ...

functional-tags: #insert one or more functional tags of the cxn type. First look up "meaning"/"information structure" tags on https://comparative-concepts.github.io/cc-database/. If no tag applies, choose a name commonly used in the (typological) literature)  ------------ formal tags, vanno cercat nella lista di cc, se esiste un cc con lo stesso nome, allora aggiungiamo "cc:TAG", altrimenti solo "TAG"
