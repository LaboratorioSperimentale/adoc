name: |
  Low version qualification

cxn-machine-readable-formalization: |
  cxn_119.conllc

form: |
	-  DET X dei poveri
	-

function: |
	-  QUALIFICATION of an external item Y through the reference to
  X
	-  You may use this phrase to qualify something or someone
  which corresponds to a worse version of something or someone
  else. The 'good' versions you make reference to should
  belong to the collective knowledge: well-known things
  (concrete or abstract) or famous people. The sense of the
  phrase is to describe Y as a low-quality thing but still as
  the best options one can get in lack of resources.
	-

