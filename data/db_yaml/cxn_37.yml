cxn-id: |
  37

name: |
  Art. indet.+N1+ Prep. "di" semplice o articolata + N2

cxn-machine-readable-formalization: |
  cxn_37.conllc

form: |
	-  Art. indet.+N1+ Prep. "di" semplice o articolata + N2
	-

function: |
	-  Modo di dire per esaltare le qualità, positive o negative,
  di una persona, un luogo,  un oggetto. Possiamo trovare
  questa costruzione sia nel registro informale che formale, a
  seconda dell'espressione utilizzata.
	-
	-  Il significato dell'insieme non è deducibile da quello delle
  singole parti. Bisogna anche guardare al contesto
  comunicativo in cui si realizza questa costruzione, in modo
  da capirne il significato e riuscire a decodificarlo.

restrictions: |
	-
	-  Questa costruzione richiede sempre un articolo
  indeterminativo che si accorda con N1. Vi sono diverse
  restrizioni sui nomi che possono comparire nelle posizioni
  di N1 e N2.  Esempio: Questo lavoro è una rottura di tempo
  -> non ha alcun senso! Inoltre, non è possibile sostituire
  la preposizione "di" (che può comparire come semplice o
  articolata) con altre preposizioni.

coll-preferences: |
	-
	-  Non è possibile cambiare l'ordine dei costituenti, in quanto
  la costruzione non avrebbe più senso. Esempio1: Sei proprio
  una rapa di testa!-> non ha senso!   

