cxn-id: |
  181

name: |
  Una Costruzione  in spagnolo

cxn-machine-readable-formalization: |
  cxn_181.conllc

form: |
	-  Fonologia: [toˈmaɾ el ˈpe.lo] Morfologia:  Tomar: infinitivo
  del verbo prendere  El: articolo determinato maschile
  singolare Pelo: sostantivo singolare maschile (capelli).
  Sintassi:  Tomar: Verbo  El pelo: oggetto diretto.
	-

function: |
	-  Pragmatica:  È usata principalmente per indicare che una
  persona prende in giro a un'altra e la sua interpretazione
  dipenderà del contesto e della relazione tra i parlanti. 
  Semantica: Fa riferimento a un senso figurativo dentro del
  campo semantico del ingagno e dello scherzo. Discorsiva: 
  Organiza le interazioni permettendo la introduzione di umore
  e ironia e può aiutare a suavizzare il tono della
  converzazione.  
	-  "Tomar el pelo": Si tratta di una costruzione del tipo
  idiomatica in un senso figurativo e significa prendere in
  giro a cualquno. La traduzione letterale sarebbe prendere
  dai capelli. 
	-

