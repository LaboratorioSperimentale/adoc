cxn-id: |
  4

name: |
  Discontinuous reduplication with antonymic pairs

cxn-machine-readable-formalization: |
  cxn_4.conllc

form: |
	-  Xi Adv1 Xi Adv2
	-

function: |
	-  PLURALITY|VARIETY of X
	-
	-

restrictions: |
	-  Adv1 / Adv2 = deictic spatial adverbs Adv1 = antonym of Adv2
  The order in which the two Advs appear is restricted (fixed
  order). 
	-

coll-preferences: |
	-  X = tendentially N or V (other categories are possible but
  marginal) X = tendentially single word (other elements, like
  phrases or sentences, are possible but more marginal) The
  construction is instantiated by daughter-constructions with
  their own collocational preferences.
	-

usage: |
  Infrequent

