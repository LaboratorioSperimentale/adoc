cxn-id: |
  7

name: |
  Pseudo-coordination

cxn-machine-readable-formalization: |
  cxn_7.conllc

form: |
	-  prendere e V
	-

function: |
	-  (BEGIN TO) V {UNEXPECTEDLY | SUDDENLY | ABRUPTLY}
	-  The function of the construction is not predictable from its
  parts: it's not a true coordination of two events, but a
  single complex predicate, where prendere (or its formal
  variants) is a light verb that acquired a grammatical
  meaning of inchoativity (abruptness) and mirativity that is
  projected onto V. Possible negative connotation of
  disappointment or annoyance. Informal register only. Formal
  variants: prendere su e V, pigliare e V, pigliare su e V
	-

restrictions: |
	-
	-

coll-preferences: |
	-  V = tendentially a motion verb, but other semantic verb
  classes may take part in the construction (host expansion).
	-

usage: |
  Infrequent

