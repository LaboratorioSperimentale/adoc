note: |
	-  Tutti gli esempi hanno come fonte l'esperienza. Di evidenze
  nei copora non ce ne sono, ma il risultato era atteso date
  le caratteristiche della costruzione. L'idea della
  costruzione nasce dalla frequentazione di persone
  provenienti dalla Puglia. La costruzione risultava
  assolutamente grammaticale alle loro orecchie, mentre alle
  mie e a chi non proveniva dallo stesso posto no.  
