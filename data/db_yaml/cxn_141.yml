name: |
  Ancora ora Construction

cxn-machine-readable-formalization: |
  cxn_141.conllc

form: |
	-  Ancora + ora + V (di sorpresa) 
	-

function: |
	-  "Ancora" come equivalente di "soltanto". 
	-  La costruzione si riscontra nell'italiano regionale parlato
  in Puglia come sinonimica rispetto a "soltanto ora". Si
  accompagna a verbi che la maggior parte delle volte
  esprimono sorpresa. Viene utilizzata esclusivamente nel
  parlato e quasi esclusivamente in situazioni diafasicamente
  informali. 
	-

