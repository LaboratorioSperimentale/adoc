name: |
  Passive Construction

cxn-machine-readable-formalization: |
  cxn_158.conllc

form: |
	-  N + Vpass + (PPagent)
	-

function: |
	-  La costruzione passiva indica un'azione compiuta da un
  agente su un paziente, in cui il paziente è il soggetto e
  l'agente è opzionalmente espresso fa un sintagma
  preposizionale. E' altamente schematica, tanto che diversi
  studiosi sostengono che le forme passive (inglesi) siano una
  famiglia di costruzioni, piuttosto che un unica costruzione
  (si veda ad esempio Tomasello 2005).
	-
