name: |
  Homolexemic binominal adverbial construction #2

cxn-machine-readable-formalization: |
  cxn_80.conllc

form: |
	-  Ni Prep Ni
	-

function: |
	-  Expression of a large quantity/set or a high degree of
  something. Possible negative connotation of annoyance.
	-  The construction says that there is "plenty" of something,
  but sometimes the speakers feel this quantity too much.
	-

restrictions: |
	-  Ni represents the same lexeme (a NOUN), before and after the
  PREPOSITION. N is usually countable and concrete. N can be
  singular or plural, the plural form tends to be prevalent.
	-

