cxn-id: |
  95

name: |
  "avere + N" idiomatic construction

cxn-machine-readable-formalization: |
  cxn_95.conllc

form: |
	-  avere + N Formal variant: avere + N + Prep; avere + ART + N
  + Prep
	-

function: |
	-  PRAGMATIC
	-  Costruzione impiegata per la formazione di frasi idiomatiche
  con il verbo avere. Il verbo avere non assume nessun valore
  specifico: il significato lessicale dell’espressione dipende
  dal sostantivo con cui avere si combina
	-

restrictions: |
	-   N sempre singolare ART, se presente, sempre determinativo
  sing.
	-

coll-preferences: |
	-  N astratto che indica una necessità (fame, sete); N concreto
  con valore metaforico per indicare una qualità del soggetto
	-

usage: |
  Average

