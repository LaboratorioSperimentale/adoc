name: |
  Modal prepositional phrase

cxn-machine-readable-formalization: |
  cxn_77.conllc

form: |
	-  a N
	-

function: |
	-  MODALITY
	-  This PREPOSITIONAL PHRASE represents the modality in which
  is carried out a certain action, thus involving a VERB, but
  it can also be attached to NOUNS (see for instance bagaglio
  a mano).
	-

restrictions: |
	-  The NOUN can be determined (al sangue, al taglio).
	-

coll-preferences: |
	-  It often appears with nouns referring to body parts,
  sensations or reckoning.
	-

usage: |
  Frequent

