form: |
	-  vuoi X  vuoi Y
	-

function: |
	-  Funzione discorsiva al fine di fornire più opzioni per
  spiegare una causa. 
	-  L'espressione vuoi X vuoi Y è usata per dare due (o talvolta
  tre) possibili cause di un certo evento. Usato solo nel
  registro informale. Il vuoi può essere seguito da diverse
  combinazioni di parole appartenenti a classi grammaticali
  diverse, come dalla coppia DET+N, PREP+N, PREP+DET+N,
  PREP+ADJ o talvolta anche da intere proposizioni. 
