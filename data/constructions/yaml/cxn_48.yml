note: |
  -  La costruzione descritta tende spesso ad occorrere
  intersecata con una costruzione relativa --> S che spingere
  (O) a V        Es. La cosa che ci ha spinto a fare musica
  insieme è stata l’amore per le radici che sentivamo in
  qualche modo comuni. Source: corpusitaliano.it
  -  USAGE: CONVENZIONALIZZAZIONE: si riscontra una preferenza,
  de facto, nella scelta del verbo per la costruzione
  dell’idiom          Alcuni recenti studi hanno spinto a
  ipotizzare che mangiare cioccolato...              ?? Alcuni
  recenti studi hanno premuto a ipotizzare che mangiare
  cioccolato... (la convenzionalizzazione si rintraccia, nel
  caso portato a esempio, nell’aver affidato il senso di
  “indurre” a spingere e non a premere)

