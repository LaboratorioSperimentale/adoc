name: |
  S spingere (O) a V 

cxn-machine-readable-formalization: |
  cxn_48.conllc

form: |
  -  S spingere (O) a V 
  -

function: |
  -  X determines/influences (Y) to [do something]z
  -
  -  Il verbo spingere, in relazione con la costruzione nel
  complesso, assume un valore semantico specifico,
  riconducibile alla formula «esercitare influenza al punto
  da»

restrictions: |
  -
  -  X= N, nominalized sentence (formal/specialized register),
  pronoun; more rarely V Y does not necessarily occur. If
  present,  Y= N, nominalized sentence (formal/specialized
  register), pronoun Z= V;     possible, but very rarely
  nominalized sentences (formal/specialized register)-->
  different construction

coll-preferences: |
  -
  -  La stessa costruzione sembrerebbe ammettere in maniera
  equivalente il verbo “spingere” e il verbo “portare”.
  Eppure, la scelta dell’uno o dell’altro verbo sembrerebbe
  orientare il meaning della costruzione verso direzioni
  diverse: SPINGERE --> esercitare influenza al punto tale
  da    Es. La cattiva condizione meteo lo ha spinto a
  rinunciare al fine settimana in montagna. PORTARE -->
  determinare/causare Es. La cattiva condizione meteo lo ha
  portato a rinunciare al fine settimana in montagna.

