note: |
  -  Possibile caratterizzazione a livello diatopico. Possibile
  ambiguità di forma con la costruzione della frase scissa
  (es. "è qui che non sa cosa fare" - ambiguità da sciogliere
  in base al contesto o alla prosodia/intonazione). 
  -  USAGE: La costruzione viene di solito preferita a forme
  standard per enfatizzare la duratività dell'azione.Quando il
  livello di idiomaticità è alto (con lì e qui) la costruzione
  può essere ricondotta Ad esempio: "Sono ancora lì che
  contano" > "Stanno ancora contando" 

