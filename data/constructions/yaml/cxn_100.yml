name: |
  Emphatic construction with "quanto" + Adj

cxn-machine-readable-formalization: |
  cxn_100.conllc

form: |
  -  quanto sono Adj (di X)
  -

function: |
  -  Expression of and emphasis on a feeling and, if specified,
  what causes it.
  -  The construction is used mainly in informal settings to
  express and intensify the feeling of an emotion. Adj
  describes a feeling experienced by the subject and X
  expresses the reasons of that feeling.
  -

restrictions: |
  -  Adj= expresses a feeling X= V or N or a phrase. It can also
  be unspecified or implicit.
  -

coll-preferences: |
  -  When X = V, V tendentially describes an action done by the
  speaker
  -

