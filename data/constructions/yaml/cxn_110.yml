name: |
  "tanto... quanto..." contrstuction

cxn-machine-readable-formalization: |
  cxn_110.conllc

form: |
  -  tanto x quanto y
  -

function: |
  -  semantica
  -  Se in un enunciato sono presenti "tanto" e "quanto" in
  correlazione, introducono due elementi messi in relazione di
  uguaglianza. Ovvero i due elementi sono paragonati e vengono
  considerati sullo stesso piano. "Tanto" e "quanto" possono
  essere seguiti da aggettivi, da sintagmi verbali e nominali.
