name: |
  ADJ-per-ADJ reduplicazione discontinua

cxn-machine-readable-formalization: |
  cxn_143.conllc

form: |
  -  ADJi per ADJi
  -

function: |
  -  Sottolinea il fatto che una situazione non sia più
  modificabile
  -  Pattern formato dalla ripetizione dello stesso aggettivo
  immediatamente prima e immediatamente dopo la preposizione
  per. Indica una situazione che non è più modificabile o uno
  stato in cui, qualunque cosa si faccia, il risultato rimane
  invariato. Spesso la costruzione viene introdotta da
  espressioni come "(tanto) ormai" oppure "a questo punto".
  Inoltre, la frase in cui compare la costruzione viene spesso
  lasciata in sospeso e non viene portata a termine.
  -

