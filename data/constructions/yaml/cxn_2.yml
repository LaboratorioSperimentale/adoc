cxn-id: |
  2

name: |
  non V (ci+essere) - N - che V (tenere)

cxn-machine-readable-formalization: |
  cxn_2.conllc

form: |
  -  non V (ci+essere) - N - che V (tenere)
  -

function: |
  -  Esprime determinazione al raggiungimento di uno scopo,
  enunciato indifferentemente prima o dopo questa costruzione:
  esprime determinazione nel raggiungere un obiettivo,
  talvolta superando proprio l'ostacolo enunciato nella
  costruzione.
  -
  -  Il significato dell'espressione non è deducibile dalla
  semplice somma dei significati delle parti: il verbo tenere
  qui non sta per "prendere, afferrare" quanto piuttosto per
  "essere abbastanza valido", valendo "reggere" (o meglio,
  "non reggere")

restrictions: |
  -
  -  N può essere solamente un sostantivo. Ad esempio, non può
  mai essere riempito da un aggettivo: oggi mi vesto di rosso,
  *non c'è verde che tenga. Inoltre V (tenere) può essere
  declinato solamente al congiuntivo, e solamente alla III
  pers. sing. o plur.

