function: |
  -  La costruzione consiste in un Tema (soggetto) che si muove
  lungo un percorso verso un punto diverso dello spazio. A
  differenza della costruzione di moto causato, la causa
  esterna del movimento non fa parte dell'evento
  concettualizzato.
