name: |
  Complemento di luogo in Friuli Venezia Giulia

cxn-machine-readable-formalization: |
  cxn_120.conllc

form: |
	-  là/lì/qua/qui + di + (articolo) + nome/pronome
	-

function: |
	-  Espressione del complemento di luogo (stato, moto a, moto
  da)
	-  La costruzione si usa nell'italiano regionale parlato in
  Friuli Venezia Giulia per indicare lo stato in luogo, il
  moto a luogo e il moto da luogo in situazioni informali. La
  costruzione è sentita dai parlanti come regionale ma viene,
  comunque, usata molto nel parlato spontaneo. Si tratta di
  una traduzione in italiano di una costruzione dialettale.
	-

