form: |
	-  Verbo + Locuz. Avverb"a più non posso" 
	-

function: |
	-  Espressione avverbiale usata nell'italiano familiare.
  Letteralmente: "quanto più è possibile", riferendosi
  all'azione espressa dal verbo che lo precede.
	-
	-  La semantica di tale costruzione è deducibile dalle sue
  parti.

restrictions: |
	-
	-  La costruzione può esistere solo se la locuazione è
  preceduta da un verbo.

