function: |
	-  Il verbo mettere non è usato nella sua semantica di
  collocare qualcosa in un determinato posto, ma con il
  significato di allestire, formare, organizzare
	-
	-  Il significato generale della costruzione non è deducibile
  dalle sue componenti. Il verbo mettere ha il significato
  di collocare, posare; la preposizione su è usata come
  sinonimo di sopra

