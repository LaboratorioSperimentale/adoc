note: |
	-  La costruzione predilige la forma verbale "dica", ma in un
  esempio tratto dal CORIS è stato rintracciato un esempio in
  cui compare la forma verbale "immagini". Si riporta di
  seguito l'esempio: In  non s ' immagini , ci porge due
  foglietti e un pastello rosso : " Identikit , prego "  http:
  //corpora.ficlit.unibo.it/TCORIS/Context.php?Start=20919156&
  End=20919157
	-  USAGE: la costruzione viene di solito preferita a forme
  funzionalmente corrispondenti quali, per esempio, “molto
  celermente, molto in fretta, all’istante”, per la sua
  maggiore intensità in termini di effetto sull’interlocutore.
  Sembra infatti che porti con sé un senso di velocità più
  esplicito rispetto a quello che espressioni analoghe possano
  veicolare

