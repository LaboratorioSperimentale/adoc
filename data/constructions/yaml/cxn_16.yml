cxn-machine-readable-formalization: |
  cxn_16.conllc

form: |
	-
	-  la costruzione si presenta come anomala rispetto alle regole
  morfosintattiche dell'italiano a causa di una ellissi di
  natura frasale. Di fatti, è del tutto assente parte della
  comparazione tra i due termini della costruzione, che
  potrebbe essere così parafrasata "in meno tempo rispetto a
  quello che si impiegherebbe a dir(lo)".

function: |
	-  locuzione avverbiale che ha il significato di “molto
  celermente”. Sostituisce quest’ultima espressione per porre
  enfasi sul concetto di velocità, ulteriormente espresso dal
  ritmo con cui si pronuncia la costruzione, che è di fatto
  composta in maggioranza da parole monosillabiche (salvo
  “dica”)
	-
	-  il significato dell’espressione è facilmente intuibile a
  partire dalla somma dei significati assunti dai vari
  componenti che la costituiscono

restrictions: |
	-
	-  l’espressione è totalmente fissa, ossia è vincolata a
  determinati slot strutturali. Tuttavia, è possibile
  rintracciare una forma analoga come “in men che non si
  immagini”, dove il verbo “dire” viene sostituito da
  “immaginare”. In ogni caso, il verbo è sempre coniugato alla
  terza persona singolare del congiuntivo presente, tant'è che
  un'espressione come *"In men che non si dice/dicono/..." è
  agrammaticale

coll-preferences: |
	-
	-  nella stragrande maggioranza dei casi, la prima parte della
  costruzione, verosimilmente quella formata da “in men che
  non si”, è accompagnata dal verbo “dire”

