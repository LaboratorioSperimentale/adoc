function: |
	-  antipresupposizionale negazione per affermare
	-  La costruzione è legata al mondo dei meme e dei social,
  soprattutto Instagram e Tiktok, e viene usata per
  dichiarare, attraverso una negazione ironica, un'azione
  compiuta che può essere ragione di vergogna o imbarazzo, ma
  che soprattutto va a contrapporsi con una presupposizione
  dettata dall'opinione dei più, dal buonsenso generale, da un
  comune modo di comportarsi, da una conoscenza condivisa o da
  quanto precedentemente affermato nella conversazione in cui
  è inserita; il contesto è, comunque, fondamentale perché
  risulti il palese il contrasto tra una massa (che siano gli
  altri interlocutori o la comunità di riferimento) e l'io del
  parlante.
	-

