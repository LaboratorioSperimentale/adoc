  forma, es. a faccia a faccia (mancanza di variazione durante
  la ripetizione della preposizione e del sostantivo); di
  tanto in tanto (variazione della preposizione, ma non
  dell'avverbio); di male in peggio (variazione della
  preposizione e dell'avverbio)

