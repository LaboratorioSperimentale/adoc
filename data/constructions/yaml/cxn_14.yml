note: |
	-
	-  USAGE: l'espressione è più frequente rispetto ad altre forme
  altrettanto disponibili nel lessico mentale dei parlanti, ma
  viene preferita per la sua maggiore efficacia comunicativa.
  Inoltre, sebbene una espressione come "bello/a come una
  stella" è altrettanto ben formata e comprensibile, non è
  quella che viene effettivamente impiegata dai parlanti
  italofoni

