cxn-id: |
  14

name: |
  bello/a come Det N

cxn-machine-readable-formalization: |
  cxn_14.conllc

form: |
	-  bello/a come Det N
	-  la costruzione non presenta peculiarità sul piano sintattico

function: |
	-  generalmente questa costruzione, che si presenta come una
  similitudine, viene usata al posto del superlativo assoluto
  “bellissimo/a” (detto di una persona) in modo da accentuare
  il complimento espresso 
	-
	-  il significato complessivo dell’espressione è predicibile
  dalla somma dei significati delle parti costituenti. La
  predicibilità va ricollegata al fatto che si tratta di una
  similitudine, e come tale ritaglia un paragone tra due
  entità accomunate da una qualche caratteristica. Nella
  fattispecie, come si può notare dagli esempi raccolti, il
  paragone avviene con il sole, un angelo e un dio, che per
  definizione incarnano la bellezza suprema

restrictions: |
	-
	-  come si può notare dagli esempi forniti, all’interno della
  costruzione ci sono due slot strutturali fissi, ovvero
  quello riempito dall’aggettivo qualificativo “bello”
  (passibile di flessione) e quello riempito dalla
  congiunzione “come” (per innestare la similitudine). Le
  altre posizioni presentano una parziale flessibilità, in
  quanto il Det può essere sia definito che indefinito e il N
  può differire da contesto a contesto, anche se bisogna
  sempre lasciarne invariata la semantica positiva. In altre
  parole, non si può, per esempio, dire “bello come un morto”,
  perché in quel caso staremmo di fronte a un altro tipo di
  costruzione, con uno scopo diverso

coll-preferences: |
	-
	-  la costruzione predilige i nomi che presentano una semantica
  intrinsecamente positiva

