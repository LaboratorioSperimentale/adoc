cxn-id: |
  75

name: |
  mongo- construction

cxn-machine-readable-formalization: |
  cxn_75.conllc

form: |
	-  [mongo-[X]]ADJ
	-

function: |
	-  PEJORATIVE
	-  The mongo- construction exemplifies a pejorative assessment
  by the speaker about a certain animate entity: in
  particular, adjectives formed by this prefixoid, are used to
  refer to poor psychomotor and intellectual skills shown by
  such entity. This prefixoid originates from the Italian
  adjective mongolo, literally translateable as Mongolian, but
  here used in a derogatory sense to refer to people affected
  by Down syndrome (see for instance mongoloide).
	-

restrictions: |
	-  X is usually an ADJECTIVE or a SUFFIX
	-

coll-preferences: |
	-  It seems that X tends to refer to motor skills and movements
  affected by neurological disorders (see for
  instance mongospastico, or mongoflettico, probably derived
  from mongoplettico (see for example apoplettico) plus the
  verb flettere).
	-

