note: |
	-  Note 1: these adjectives, apart from the fact that they are
  offensive, have colloquial usage but their form is somehow
  mimicking technical terms from medicine or other sciences;
  as for mongolitico we can see that adjectives about
  archaeological eras (paleolitico, neolitico...) have a
  certain influence (even though it is hard to say whether it
  is subsequent to the word formation or a concurrent cause).
  The forms in -litico are reminiscent of informal adjectives
  like favalitico (from fava) used in some Tuscan varieties.
  Note 2: most of the linked sources are written, but in a
  style that resembles common speech.
