name: |
  Reduplicazione discontinua del tipo: N-DET-N

cxn-machine-readable-formalization: |
  cxn_117.conllc

form: |
  -  N DET N (di cui DET è un articolo partitivo plurale).
  -

function: |
  -  INTENSIFICAZIONE
  -  Si tratta di un pattern di intensificazione tramite
  reduplicazione discontinua del tipo N-DET-N, in cui Art
  indica un articolo partitivo (e non una preposizione
  articolata).  Questo cluster è formato da: - N1, che è
  generalmente singolare; - DET, ossia un articolo partitivo
  plurale (dei, degli, delle); - N2, equivalente a N1 ma in
  forma plurale.
  -

