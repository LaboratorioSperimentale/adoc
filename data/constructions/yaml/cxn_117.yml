note: |
  -  Questa costruzione è piuttosto aperta: i suoi componenti,
  eccetto l'articolo partitivo, possono essere scelti
  arbitrariamente dal parlante, purchè siano sostantivi
  equivalenti, di cui il primo singolare ed il secondo
  plurale. (L'idea è nata dalla visione di un episodio del
  cartone animato Spongebob, in cui il protagonista mostrava
  di essersi allacciato perfettamente le stringhe delle
  scarpe, creando così il nodo dei nodi, ossia un nodo
  perfetto. Siamo di fronte ad una evidente forma di
  intensificazione).
