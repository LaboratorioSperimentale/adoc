function: |
  -  Costruzione utilizzata prevalentemente nell'italiano parlato
  e nel baby talking. La ripetizione dello stesso aggettivo va
  a rafforzarlo, intensificarlo e chiarirlo. 
  -
  -  Rafforza il significato dell'aggettivo in questione. 

restrictions: |
  -
  -  L'espressione è utilizzata in determinati contesti,
  solitamente familiari e/o intimi, informali. Solitamente uno
  dei due partecipanti è un bambino, dato che questa
  costruzione presuppone un certo tipo di "tenerezza". 

