name: |
  doppia negazione

cxn-machine-readable-formalization: |
  cxn_129.conllc

form: |
  -  non è che non + V
  -

function: |
  -  Attenuare. Sottoindende da parte di chi parla una presa di
  distanza da ciò che la prima negazione nega.
  -  Il significato della sruttura di doppia negazione non
  corrispone a una affermazione del tipo "non (non p)" = p, ma
  vi è uno scarto semantico. Ha un elevato valore pragmatico.
  Pone in una zona di indeterminatezza dove non si nega del
  tutto, ma neanche si afferma a pieno.
  -

