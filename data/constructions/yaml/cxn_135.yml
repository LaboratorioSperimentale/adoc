cxn-id: |
  135

name: |
  Costruzione "che...che"

cxn-machine-readable-formalization: |
  cxn_135.conllc

form: |
	-  Che+N/Adj+che+V
	-

function: |
	-  intensificazione di N/Adj
	-  Costruzione utilizzata per intensificare il nome o
  aggettivo, invertendo l'ordine dei costituenti (VO > OV). 
  Esempi (miei): Che dolce che sei = sei molto dolce; Che casa
  che ha = ha una casa molto (bella/grande/particolare/brutta,
  a seconda del contesto); Che scene disgustose che si vedono
  = si vedono scene particolarmente disgustose. 
	-

