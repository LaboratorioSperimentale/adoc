function: |
  -  funzione enfatica.
  -  La costruzione, estremamente colloquiale e usata in una
  vaerietà non standard dell'italiano, tramite l'aggettivo che
  segue il primo "che," enfatizza lo stato d’animo/sentimenti
  suscitati dall’azione espressa dal verbo che segue il
  secondo "che".
