cxn-id: |
  3

name: |
  V (dire) + N + N

cxn-machine-readable-formalization: |
  cxn_3.conllc

form: |
  -  V (dire) + N + N
  -  Substantive idiom, espressione lessicalmente specificata
  (principi combinatori generali V + Obj + Obj fissi) che
  assume una particolare interpretazione idiomatica.

function: |
  -  Espressione idiomatica usata correntemente nell'italiano
  popolare. Indica un contesto comunicativo in cui un "X parla
  male (sparla) di Y" o in cui "sia X che Y parlano male l'uno
  dell'altro".
  -
  -  Esprime l'astio o la disapprovazione di una persona o tra
  due o più persone.

restrictions: |
  -
  -  L'espressione, per essere compresa dagli interlocutori, deve
  essere enunciata in contesti specifici (soprattutto
  informali) in cui un interlocutore riferisce agli altri
  partecipanti che un determinato soggetto X parl- male di un
  qualsiasi oggetto Y.

coll-preferences: |
  -
  -  La costruzione prevede che ci sia un verbo V(dire)
  all'inizio dell'espressione (pur potendo essere coniugato in
  qualsiasi forma; anche alla forma passiva o reciproca),
  seguito da due oggetti Obj che non variano in alcun caso
  nella forma. I due oggetti possono essere seguiti da un SP
  (sintagma preposizionale: di qualcuno).

