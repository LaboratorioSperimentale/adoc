cxn-id: |
  59

name: |
  V. (mettersi) + Prep. (nelle) + N. (mani) + Prep. (di) + N.
  (qualcuno)

cxn-machine-readable-formalization: |
  cxn_59.conllc

form: |
  -  V. (mettersi) + Prep. (nelle) + N. (mani) + Prep. (di) + N.
  (qualcuno)
  -

function: |
  -  Espressione utilizzata per indicare la volontà da parte di
  un individuo di affidarsi completamente alle cure di un
  altro individuo.
  -
  -  L'espressione indica l'affidamento o l'abbandono alle cure
  di un individuo, mediante un lessema verbale semanticamente
  neutro che si appoggia a un sostantivo semanticamente
  forte. «Mani» rappresenta il centro semantico della
  costruzione.

restrictions: |
  -
  -  L'espressione viene tendenzialmente utilizzata per indicare
  una presunta soluzione a una situazione di difficoltà.

coll-preferences: |
  -
  -  L'espressione può essere introdotta da altri verbi,
  veicolando una sfumatura semantica differente a seconda dei
  casi (Cadere, essere, mettersi).

