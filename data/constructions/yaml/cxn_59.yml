note: |
  -  L'espressione ha origine medievale e deriva dal gesto
  simbolico (immixtio manuum) che legava un vassallo al suo
  signore, tramite un cerimoniale pubblico di giuramento.
  Differenza tra «mettersi nelle mani di qualcuno» ed
  «essere nelle mani di qualcuno»: nel primo caso, si indica
  la volontà attiva del protagonista dell'azione di affidarsi
  alle cure di un altro individuo; nel secondo caso, invece,
  si indica la passività del protagonista dell'azione, il
  quale è soggetto all'autorità e al potere incontrastato di
  un altro partecipante. («Cadere nelle mani di qualcuno»:
  diventare prigioniero di qualcuno) «Sono nelle mani di Dio!»
  (Completo abbandono alla forza protettiva di una divinità)
  «Put your life in someone's hands»  «I put myself in
  your hands»  «Fall into their hands»
  -  USAGE: Espressione utilizzata in contesti informali.

