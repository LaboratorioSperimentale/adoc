name: |
  Costruzioni "in croce"

cxn-machine-readable-formalization: |
  cxn_131.conllc

form: |
  -  Num+N+in croce
  -

function: |
  -  Sottolineare la quantità ridotta di N.
  -  Questa costruzione viene utilizzata per rimarcare la scarsa
  quantità di qualcosa. La forma più utilizzata è due parole
  in croce che significa "poche parole".
  -

restrictions: |
  -
  -

coll-preferences: |
  -  Num è preferibilmente "due", "tre" o "quattro", ma ci sono
  occorrenze con numeri più grandi, che solitamente
  specificano la quantità esatta di N. N può essere omesso
  quando recuperabile dal contesto.
  -

