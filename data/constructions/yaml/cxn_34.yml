cxn-id: |
  34

name: |
  neanche per + N(sogno/idea/scherzo)

cxn-machine-readable-formalization: |
  cxn_34.conllc

form: |
  -  neanche per + N(sogno/idea/scherzo)
  -

function: |
  -  Serve ad esprimere in modo enfatico la negazione di qualcosa
  (o in risposta ad una domanda o in aggiunta a "non" in una
  dichiarativa), anche con funzione pragmatica di comunicare
  sdegno e disapprovazione. 
  -
  -  Il suo significato rafforzativo della negazione, soprattutto
  nei casi in cui è utilizzato per esprimere lo sdegno o la
  ritrosia del parlante di fronte a qualcosa, non è dato dal
  significato letterale di
  neanche+per+sogno(/idea/scherzo), cioè "(qualcosa che non
  avviene/esiste) nemmeno in un sogno, in un'idea, in uno
  scherzo". 

restrictions: |
  -
  -  N deve essere per forza una parola di una lista determinata,
  non può essere un qualsiasi sostantivo; in particolare, ciò
  che accomuna i sostantivi accettati, a livello semantico, è
  il fatto di essere un risultato dell'attività del pensiero,
  un frutto della mente umana (idea, sogno, scherzo...). 

