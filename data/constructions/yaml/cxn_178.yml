cxn-id: |
  178

name: |
  Meglio X che Y

cxn-machine-readable-formalization: |
  cxn_178.conllc

form: |
  -  "meglio": avverbio invariabile "Che":  congiunzione
  comparativa che introduce il termine di paragone  X e Y
  possono essere verbi, aggettivi, sostantivi o intere
  proposizioni. 
  -

function: |
  -  SEMANTICA indica preferenza relativa tra due opzioni di cui
  la prima sembra piu' accettabile.  DISCORSIVA per
  contrapporre idee, situazioni, opinioni. 
  -  Una costruzione che esprime una preferenza relativa tra due
  situazioni, oggetti o azioni, dove la prima opzione X e'
  considerata piu' accettabile della seconda Y. E' usata per
  confronti, consigli, espressioni di giudizio personale.
  -

restrictions: |
  -  X e Y devono essere comparabili (es. *"meglio un maglione
  che correre") 
  -

