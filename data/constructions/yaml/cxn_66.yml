note: |
  -  Interestingly, the similar construction 'prima x e poi y'
  combines not only with verbs but also with nouns, which is
  not possible with the construction 'prima V, prima V'. For
  example: 'Prima i compiti, poi il gioco', but not 'prima i
  compiti, prima il gioco'. In the second case, the temporal
  and sometimes causal meaning is lost. 
