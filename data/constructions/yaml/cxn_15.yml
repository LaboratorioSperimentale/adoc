cxn-id: |
  15

name: |
  piove + Avv di modo

cxn-machine-readable-formalization: |
  cxn_15.conllc

form: |
  -  piove + Avv di modo
  -  non presenta anomalie dal punto di vista sintattico

function: |
  -  l’espressione viene utilizzata per indicare una pioggia
  abbondante
  -
  -  non è idiomatica perché il significato dell’espressione è
  deducibile dalla somma dei significati dei componenti che la
  costituiscono

restrictions: |
  -
  -  il verbo deve essere impersonale e selezionare
  necessariamente una locuzione avverbiale di modo

coll-preferences: |
  -
  -  come testimoniato nel corpus di riferimento, il verbo
  occorre unicamente con tre espressioni di modo quali “a
  catinelle”, “a dirotto”, “a cascate”

