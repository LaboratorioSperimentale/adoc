note: |
  -
  -  USAGE: è un’espressione utilizzata di frequente dai parlanti
  nativi per descrivere abbondanti piogge. Viene utilizzata al
  posto di espressioni come: “piove tanto”, “piove
  abbondantemente”, per porre l’enfasi sul concetto di
  abbondanza. L’espressione infatti risulta più intuitiva e
  più efficace. 

