cxn-id: |
  56

name: |
  apriti + N (cielo/terra/sesamo)

cxn-machine-readable-formalization: |
  cxn_56.conllc

form: |
	-  apriti + N (cielo/terra/sesamo)
	-

function: |
	-  Esclamazione usata per indicare (la possibilità) il
  verificarsi di un evento inatteso, di una sciagura. La
  variante "apriti sesamo!" esprime sorpresa o speranza che
  una cosa accada.
	-
	-  Il significato dell'espressione non è letterale, non si
  intende usare il verbo aprire nel suo significato standard.
  Si potrebbe dire che qui è un verbo leggero.

restrictions: |
	-
	-  N deve essere uno dei tre nomi indicati (cielo/terra/sesamo)
  affinché l'esclamazione conservi il suo significato.

