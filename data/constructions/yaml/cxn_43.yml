name: |
  X(v) + compl. modo (come) + Y(n)

cxn-machine-readable-formalization: |
  cxn_43.conllc

form: |
  -  X(v) + compl. modo (come) + Y(n)
  -  Si tratta di una costruzione verbale intercambiabile 

function: |
  -  Similitudine (per denotare il modo in cui si canta) -
  Cantare come una rana (in modo sgraziata) - Cantare come un
  fringuello (in modo allegro) - Cantare come un usignolo
  (molto bene)
  -
  -  Il verbo cantare non è utilizzato solo per indicare
  un’azione ma per denotare un paragone. 

restrictions: |
  -
  -  X deve essere sempre lo stesso verbo mentre Y può variare a
  seconda del paragone. 

