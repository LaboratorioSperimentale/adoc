note: |
  -  It is a construction in evolution, only used in oral and
  informal conversations. It coexists with the more usual and
  standard constructions stare + PP (sto di merda; sto da
  schifo) or stare + AdvP (sto come uno straccio). It seems to
  be more used by speakers from Central and Southern Italy,
  where it is considered as almost stardard (especially in the
  regional Italian from Rome: sto 'na crema), while it is
  perceived as non-standard by Northern speakers.
