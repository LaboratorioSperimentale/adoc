cxn-id: |
  102

name: |
  Non ... ne frega

cxn-machine-readable-formalization: |
  cxn_102.conllc

form: |
	-  AVV NEG (non) + PRO + CLITICO (ne) + V (frega) + SN/SAVV
	-

function: |
	-  SEMANTICO/PRAGMATICA
	-  it's a contruction to say that a person doesn't care about
  something often used in informal situations and vulgar
	-

restrictions: |
	-  AVV NEG = non PRO = dativo senza preoposizione CLITICO = ne
  V= frega (non declinato) SN= ART indefinito + N
  (semanticamente ristretto a "cazzo" ed eufemismi) SN può
  essere espanso con aggettivi e avverbi e SPREP SAVV= AVV di
  quantità ristretto a "molto" "tanto" "niente" "nulla" SAVV
  può essere espanso con aggettivi e avverbi e SPREP
	-

