cxn-id: |
  103

name: |
  a parte che as a discourse marker

cxn-machine-readable-formalization: |
  cxn_103.conllc

form: |
  -  a parte che X
  -

function: |
  -  Discursive
  -  A parte che introduces a new piece of information, taken-
  for-granted and unquestionable, that the speaker wants to
  add to the main information, usually expressing some kind of
  evaluation (generally a negative one). The new information
  can be: an argument supporting what expressed in the main
  clause; a personal comment; an adjustment/correction of what
  has been previously stated; something similar to a
  concessive clause.
  -

