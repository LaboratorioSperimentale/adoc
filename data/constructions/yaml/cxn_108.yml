cxn-id: |
  108

name: |
  Far fare vs Lasciare fare

cxn-machine-readable-formalization: |
  cxn_108.conllc

form: |
	-  Fare + un infinito  Lasciare + un infinito 
	-

function: |
	-  Semantica, Pragmatica.
	-  La costruzione causativa ha due protagonisti: uno che
  "provoca" l'azione e l'altro che "fa" l'azione.Un iniziatore
  e un esecutore.  Nella frase "Mirco fa riposare la mamma"
  Mirco è l'iniziatore e la mamma è l'esecutore.
	-

restrictions: |
	-  I verbi fare e lasciare possono avere due diverse sfumature
  di significato. Il soggetto del verbo causativo ordina,
  impone, comanda oppure permette, concede, dà
  un’autorizzazione. Il verbo fare, tuttavia, può avere
  entrambe le sfumature di significato. 
	-

coll-preferences: |
	-  far capire = persuadere; lasciare stare qualcuno = non
  disturbarlo; lascia stare! = smetti di fare quello che stai
  facendo; lasciamo stare! = non parliamone più; lasciare
  perdere = non curarsi, non preoccuparsi di qualcosa. 
	-

usage: |
  Frequent

