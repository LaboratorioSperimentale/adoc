name: |
  V. parlare + prep. + N

cxn-machine-readable-formalization: |
  cxn_6.conllc

form: |
  -  V. parlare + prep. + N
  -  Perché non ci sono anomalie morfosintattiche

function: |
  -  La Costruzione indica l'assenza di ascolto da parte del
  destinatario, ovvero l'azione del parlare senza essere
  ascoltati.
  -
  -  Perché il significato del costrutto non è strettamente
  deducibile: esso indica la vanità dell'azione del parlare,
  ma non individua, ad esempio nel muro, il vero e proprio
  interlocutore.

restrictions: |
  -
  -  Perché l'espressione ha una flessibilità limitata: lo slot N
  può essere riempito solo da un ristretto numero di nomi che
  veicolano l'idea di assenza di feedback. L'ordine delle
  parole.

