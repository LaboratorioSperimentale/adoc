function: |
	-  1 Esprimere una manifestazione improvvisa e intensa fisica o
  mentale --> dare di testa; dare di matto 2 Forse esprimere
  maggiore partecipazione emotiva/coinvolgimento rispetto a un
  evento --> dare di stomaco; dare di gomito  3 Esprimere
  particolare impegno o dedizione in un'attività nel caso del
  legame con strumento --> dare di scalpello, dare di vernice
  --> variante rafforzata darci di L'interpretazione ha una
  metaforicità variabile nei vari esempi, il verbo "dare" ha
  significato che si specifica unitamente al nome.  
