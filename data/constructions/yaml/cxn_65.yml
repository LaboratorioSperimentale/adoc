cxn-id: |
  65

name: |
  X Adv che Y 

cxn-machine-readable-formalization: |
  cxn_65.conllc

form: |
  -  X Adv che Y 
  -

function: |
  -  [X]FOCUS
  -
  -  The function of the construction is not entirely predictable
  from its parts. From a semantic point of view, Adv che can
  be omitted without changing the truth conditions and the
  acceptability of the constructions (CFR., e.g., "All'asilo
  sì che si stava bene" and "All'asilo si stava bene").

restrictions: |
  -
  -  Adv = sì, no, certo. Other adverbs (e.g., sicuro, ovvio) are
  possible but rather marginal. 

coll-preferences: |
  -
  -  X = phrase (clauses are possible, although they are more
  marginal) Y = clause (X is a constituent of Y) When Adv
  is no, Y contains a negator.

