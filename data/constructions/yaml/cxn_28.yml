name: |
  Mandare all'aria - (Det) - (Agg) - N

cxn-machine-readable-formalization: |
  cxn_28.conllc

form: |
  -  Mandare all'aria - (Det) - (Agg) - N
  -

function: |
  -  Espressione utilizzata per indicare che "X" vanifica o causa
  il fallimento di "Y" espresso da N 
  -
  -  La costruzione assume il significato traslato di rendere
  vano qualcosa, compromettere un programma, impedirne la
  realizzazione. 

restrictions: |
  -
  -  A livello sintattico la costruzione presenta delle
  restrizioni:  - N può essere sia posposto che interposto  -
  N può essere preceduto da un aggettivo - la preposizione
  articolata "all" può essere sostituita dalla preposizione
  semplice "per" nella variante  - talvolta N può essere
  sostituito dall'aggettivo indefinito "tutto" che può essere 
  interposto o posposto Anche a livello semantico la
  costruzione presenta delle restrizioni perché la posizione N
  può essere riempita solo da alcune parole. N è generalmente
  un nome comune singolare o plurale, non può riferirsi a
  persona ma può indicare sia un referente concreto che un
  referente astratto. 

