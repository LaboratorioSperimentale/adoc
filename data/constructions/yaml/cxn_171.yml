cxn-id: |
  171

name: |
  Tanto (...) quanto (...)

cxn-machine-readable-formalization: |
  cxn_171.conllc

form: |
  -  X1 - Y - X2 - Y, dove X1= tanto; X2= quanto; Y= spazio da
  riempire. 
  -

function: |
  -  Costruzione comparativa / di uguaglianza
  -  In italiano questa espressione può essere ritenuta come
  appartenente alla categoria dei formal idioms, in quanto si
  tratta di una costruzione rigida, ma allo stesso tempo
  produttiva; dal momento che i due avverbi possono essere
  seguiti da qualsiasi parola.  
  -

restrictions: |
  -  Costruzione con Y= verbo Y - X1 - X2 - Y
  -

coll-preferences: |
  -  Tipicamente le parole che riempiono gli spazi tra i due
  avverbi sono aggettivi. (ex. 1) In particolare poi, è molto
  frequente la costruzione con aggettivi in relazione di
  antonimia. (ex. 2) Inoltre, è possibile che al posto degli
  aggettivi ci sia un sostantivo (molto meno frequente) (ex.
  3);  oppure un avverbio (più raro) (ex. 4). La costruzione
  ammette il riempimento anche da parte di verbi. (ex. 5)
  L’ultima modalità con cui questa struttura può essere
  utilizzata consiste nel combinare categorie di parole
  differenti associate all’elemento Y. (ex. 6) 
  -

