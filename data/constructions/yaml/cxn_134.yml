form: |
  -  Det+ N + Prep + Agg/ N  Un botto (di) + Agg/ N
  -

function: |
  -  Utilizzato in luogo di un avverbio per indicare quantità o
  qualità
  -  è una costruzione con valore avverbiale, utilizzata in luogo
  di "molto", tipica della lingua parlata. Una finalità simile
  si ritrova anche in espressioni quali "un sacco (di)", "una
  cifra", "una marea (di)". Potrebbe essere interessato dal
  fenomeno della concordanza a senso. 
