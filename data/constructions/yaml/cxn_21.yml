function: |
  -  Mette in evidenza il V2, creando delle semantiche diverse: -
  Indica l'imminenza dell'evento espresso dal V2  - Indica lo
  stato in luogo di qualcosa (es. n°1) Il verbo andare è
  semanticamente vuoto.
  -
  -  La semantica della costruzione non è deducibile dalle parti.
  Il verbo andare perde il suo significato pieno, diventando
  un verbo leggero.

