note: |
  -  lo schema della costruzione che riporto è quella in cui
  nessun elemento viene sottinteso, però preciso che sopo il
  -perchè possono seguire diversi tipi di elementi, perciò
  volendo aggiungere una forma sintetica si potrebbe indicare
  il costrutto con lo schema : non vedo perchè X, considerando
  costruzioni come " non vedo perchè no", "non vedo perchè in
  Francia". Però penso che in questi casi vengano comunque
  sottintesi elementi presenti nello schema riportato
  all'inizio. Tutti i costrutti rimangono infatti
  comprensibili grazie all'abituale utilizzo della frase, il
  quale quindi permette di sottintedere alcune sue parti, in
  congiunto con il riferimento al contesto colloquiale. 
