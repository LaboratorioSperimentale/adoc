name: |
  V (Contare) + Prep(su/sul/sulla...) + N/Pronpers 

cxn-machine-readable-formalization: |
  cxn_45.conllc

form: |
	-  V (Contare) + Prep(su/sul/sulla...) + N/Pronpers 
	-  Non regolare dal punto di vista sintattico: si pensi al
  significato lessicale del verbo contare e alle conseguenti
  restrizioni semantiche dei referenti a questo associati.
  L'applicazione e i referenti previsti entro questa
  costruzione, invece, sono soggetti e meno restrizioni
  semantiche. 

function: |
	-  L'espressione retta dal verbo Contare si allontana dal
  significato lessicale del verbo per indicare, nella
  Costruzione tutta, un giudizio di affidabilità rispetto a
  qualcuno/qualcosa. 
	-
	-  L'espressione non è facilmente interpretabile, è necessaria
  una familiarità con questa affinchè si possa comprenderne il
  senso. 

restrictions: |
	-
	-  L'applicazione e i referenti previsti per un N qualsiasi
  sono soggetti a poche restrizioni dal punto di vista
  semantico. 

