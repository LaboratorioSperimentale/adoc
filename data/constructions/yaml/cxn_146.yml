function: |
	-  [SEMk in R with SEMi]j
	-  Italian exocentric compounds.  Exocentric = the semantic
  and/or morphological properties of the entire compound do
  not coincide with those of a constituent. There is no
  compound head.
	-

restrictions: |
	-  The relation (R) can be subordinative (see example 2),
  coordinative (see example 3) or attributive (see example 1).
  In attributive NA compounds, the noun usually indicates a
  part of the body (e.g., piedipiatti 'policeman', lit.
  foot+flat).
