name: |
  Costruzione "che"

cxn-machine-readable-formalization: |
  cxn_133.conllc

form: |
  -  che+N/Adj
  -

function: |
  -  Intensificazione o attribuzione di qualità (solitamente
  positive o dimensionali) a N/Adj
  -  Viene solitamente usata come escalmazione e serve a
  intensificare il nome o aggettivo (es. che brutto=è molto
  brutto), oppure ad attribuirvi qualità positive o
  dimensionali (es. che casa=è una casa molto bella o molto
  grande), ma possono essere anche negative o di semplice
  particolarità (es. che faccia=è una faccia
  brutta/provata/sconvolta...).
  -

