form: |
	-  X(v) + prep. + X(n) 
	-  la costruzione si presenta  con la stessa forma morfo-
  sintattica.

function: |
	-  metafora; essere al verde= indica il non essere in possesso
  di denaro;  essere al settimo cielo= essere al massimo stato
  di felicità; essere in alto mare= essere lontano dalla
  soluzione di qualcosa; essere in vena= sentirsi al pieno
  delle forze e dunque nella condizione migliore per fare
  qualcosa; essere nelle canne= essere in difficoltà. 
	-
	-  perché il significato dell'espressione non dipende dalla
  semplice somma del significato delle singole parole. Ad
  esempio: "essere al settimo cielo" non implica concretamente
  il luogo in cui si trova una persona ma un suo stato
  d'animo.

